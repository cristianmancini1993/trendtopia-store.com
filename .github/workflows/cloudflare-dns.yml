name: Point DNS to GitHub Pages

on:
  workflow_dispatch:

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Update Cloudflare A records
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: trendtopia-store.com
        run: |
          set -euo pipefail
          IPS="185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153"
          ZONE_ID=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" | jq -r '.result[0].id')
          test "$ZONE_ID" != "null"
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=$DOMAIN" \
            | jq -r '.result[] | select(.content=="72.62.34.234") | .id' \
            | while read -r id; do
                curl -fsS -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id"
              done
          for ip in $IPS; do
            curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"@\",\"content\":\"$ip\",\"ttl\":1,\"proxied\":false}" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          done
