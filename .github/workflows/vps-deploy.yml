name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - "es/**"
      - "assets/**"
      - ".github/workflows/vps-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-es:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload ES locale + shared assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          source: "es,assets/js/consent-default.js,assets/js/main.js,assets/js/tracking.js,assets/css/components.css"
          target: "/tmp/tt-deploy-es"
          strip_components: 0

      - name: Install on web roots
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script_stop: true
          script: |
            set -e
            updated=0
            for base in /var/www/trendtopia-store.com /var/www/adclickmobile.com /var/www/html /root/trendtopia-store.com; do
              if [ -d "$base" ]; then
                mkdir -p "$base/es" "$base/assets/js" "$base/assets/css"
                rsync -a /tmp/tt-deploy-es/es/ "$base/es/"
                cp -f /tmp/tt-deploy-es/assets/js/consent-default.js "$base/assets/js/" 2>/dev/null || true
                cp -f /tmp/tt-deploy-es/assets/js/main.js "$base/assets/js/" 2>/dev/null || true
                cp -f /tmp/tt-deploy-es/assets/js/tracking.js "$base/assets/js/" 2>/dev/null || true
                cp -f /tmp/tt-deploy-es/assets/css/components.css "$base/assets/css/" 2>/dev/null || true
                echo "Updated ES + assets at $base"
                updated=1
              fi
            done
            if [ "$updated" -eq 1 ]; then
              exit 0
            fi
            root=$(nginx -T 2>/dev/null | awk '/^[[:space:]]*root /{print $2}' | head -1 | tr -d ';')
            if [ -n "$root" ] && [ -d "$root" ]; then
              mkdir -p "$root/es" "$root/assets/js" "$root/assets/css"
              rsync -a /tmp/tt-deploy-es/es/ "$root/es/"
              cp -f /tmp/tt-deploy-es/assets/js/consent-default.js "$root/assets/js/" 2>/dev/null || true
              cp -f /tmp/tt-deploy-es/assets/js/main.js "$root/assets/js/" 2>/dev/null || true
              cp -f /tmp/tt-deploy-es/assets/js/tracking.js "$root/assets/js/" 2>/dev/null || true
              cp -f /tmp/tt-deploy-es/assets/css/components.css "$root/assets/css/" 2>/dev/null || true
              echo "Updated nginx root $root"
              exit 0
            fi
            echo "Could not locate web root"
            exit 1
