name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "es/**"
      - "*/refund-policy.html"
      - "assets/**"
      - ".github/workflows/vps-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload home, ES, assets and refund policies
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          source: "index.html,es,assets/js/consent-default.js,assets/js/main.js,assets/js/tracking.js,assets/css/components.css,bg/refund-policy.html,cz/refund-policy.html,de/refund-policy.html,ee/refund-policy.html,en/refund-policy.html,es/refund-policy.html,fr/refund-policy.html,gr/refund-policy.html,hr/refund-policy.html,hu/refund-policy.html,it/refund-policy.html,lt/refund-policy.html,lv/refund-policy.html,pl/refund-policy.html,pt/refund-policy.html,ro/refund-policy.html,si/refund-policy.html,sk/refund-policy.html"
          target: "/tmp/tt-deploy-audit"
          strip_components: 0

      - name: Install on web roots
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script_stop: true
          script: |
            set -e
            updated=0
            for base in /var/www/trendtopia-store.com /var/www/adclickmobile.com /var/www/html /root/trendtopia-store.com; do
              if [ -d "$base" ]; then
                mkdir -p "$base/es" "$base/assets/js" "$base/assets/css"
                cp -f /tmp/tt-deploy-audit/index.html "$base/index.html"
                rsync -a /tmp/tt-deploy-audit/es/ "$base/es/"
                cp -f /tmp/tt-deploy-audit/assets/js/consent-default.js "$base/assets/js/" 2>/dev/null || true
                cp -f /tmp/tt-deploy-audit/assets/js/main.js "$base/assets/js/" 2>/dev/null || true
                cp -f /tmp/tt-deploy-audit/assets/js/tracking.js "$base/assets/js/" 2>/dev/null || true
                cp -f /tmp/tt-deploy-audit/assets/css/components.css "$base/assets/css/" 2>/dev/null || true
                for geo in bg cz de ee en es fr gr hr hu it lt lv pl pt ro si sk; do
                  if [ -f "/tmp/tt-deploy-audit/$geo/refund-policy.html" ]; then
                    mkdir -p "$base/$geo"
                    cp -f "/tmp/tt-deploy-audit/$geo/refund-policy.html" "$base/$geo/refund-policy.html"
                  fi
                done
                echo "Updated home, ES, assets and refund policies at $base"
                updated=1
              fi
            done
            if [ "$updated" -eq 1 ]; then
              exit 0
            fi
            root=$(nginx -T 2>/dev/null | awk '/^[[:space:]]*root /{print $2}' | head -1 | tr -d ';')
            if [ -n "$root" ] && [ -d "$root" ]; then
              mkdir -p "$root/es" "$root/assets/js" "$root/assets/css"
              cp -f /tmp/tt-deploy-audit/index.html "$root/index.html"
              rsync -a /tmp/tt-deploy-audit/es/ "$root/es/"
              cp -f /tmp/tt-deploy-audit/assets/js/consent-default.js "$root/assets/js/" 2>/dev/null || true
              cp -f /tmp/tt-deploy-audit/assets/js/main.js "$root/assets/js/" 2>/dev/null || true
              cp -f /tmp/tt-deploy-audit/assets/js/tracking.js "$root/assets/js/" 2>/dev/null || true
              cp -f /tmp/tt-deploy-audit/assets/css/components.css "$root/assets/css/" 2>/dev/null || true
              for geo in bg cz de ee en es fr gr hr hu it lt lv pl pt ro si sk; do
                if [ -f "/tmp/tt-deploy-audit/$geo/refund-policy.html" ]; then
                  mkdir -p "$root/$geo"
                  cp -f "/tmp/tt-deploy-audit/$geo/refund-policy.html" "$root/$geo/refund-policy.html"
                fi
              done
              echo "Updated nginx root $root"
              exit 0
            fi
            echo "Could not locate web root"
            exit 1
