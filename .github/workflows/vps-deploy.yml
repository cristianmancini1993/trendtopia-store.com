name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script_stop: true
          script: |
            set -e
            for d in /root/trendtopia-store.com /var/www/trendtopia-store.com /var/www/html; do
              if [ -d "$d/.git" ]; then
                cd "$d"
                git fetch origin main
                git reset --hard origin/main
                echo "Deployed from $d"
                exit 0
              fi
            done
            echo "No git repo found on VPS"
            exit 1
