# HTTP context (e.g. /etc/nginx/conf.d/trendtopia-home-locale-maps.conf)
# Cookie tt-home-locale overrides Accept-Language for pre-rendered home pages.

map $cookie_tt_home_locale $home_locale_cookie {
    default "";
    ~^(?<hl>en|es|pl|sk|cz|gr)$ $hl;
}

map $http_accept_language $home_locale_accept {
    default en;
    ~*^es es;
    ~*^pl pl;
    ~*^sk sk;
    ~*^cs cz;
    ~*^el gr;
    ~*^en en;
}

map $home_locale_cookie $home_locale_mid {
    default $home_locale_cookie;
    ""      $home_locale_accept;
}

map $arg_lang $home_locale_query {
    default "";
    en      en;
    es      es;
    pl      pl;
    sk      sk;
    cz      cz;
    gr      gr;
}

# ?lang= (manual switch) > cookie tt-home-locale > Accept-Language > en
map $home_locale_query $home_locale {
    default $home_locale_query;
    ""      $home_locale_mid;
}
